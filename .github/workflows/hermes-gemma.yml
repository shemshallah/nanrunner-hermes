name: Test HERMES + Gemma (Ollama)

# Runs Linux install/validation on setup changes. The Ollama API secret is
# provided ONLY to the explicitly requested manual smoke-test step.
on:
  push:
    branches: [main]
    paths:
      - "scripts/ollama_gemma_smoke.py"
      - "scripts/hermes_gemma_session.py"
      - "tests/test_hermes_gemma_session.py"
      - ".github/workflows/hermes-gemma.yml"
      - "README.md"
      - "scripts/hermes_runtime.sh"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nanrunner-hermes-${{ github.ref }}
  cancel-in-progress: false

jobs:
  nanrunner-hermes:
    name: nanrunner-hermes (isolated Ubuntu)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout this dedicated runner (no retained Git credentials)
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Checkout pinned NaNLMind HERMES plugin source (read-only)
        uses: actions/checkout@v4
        with:
          repository: shemshallah/NaNLMind_HERMES
          ref: f9c173232f0be87806e0b26bac0e5db08ce36a0d
          path: plugin-src
          persist-credentials: false

      - name: Set up Linux Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install HERMES plugin dependencies without any cloud token
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -e "./plugin-src[auth]"
          python -m pip check

      - name: Test Gemma session bridge offline (no API credential)
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -p 'test_hermes_gemma_session.py' -v

      - name: Exercise local HERMES login and hardware-node tests (mock network)
        shell: bash
        working-directory: plugin-src
        env:
          PYTHONPATH: .
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -p 'test_nannet_device_client.py' -v
          python -m unittest discover -s tests -p 'test_plugin_manifest.py' -v

      - name: Restore installed Hermes from repository Actions cache
        id: hermes-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.hermes
            ~/.local/bin/hermes
          key: hermes-ubuntu2404-x64-2bd378ed1b8d-bundle-v1

      - name: Restore repository Release runtime or pinned bootstrap
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/hermes_runtime.sh restore

      - name: Save Hermes cache before any Ollama secrets are injected
        if: steps.hermes-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.hermes
            ~/.local/bin/hermes
          key: hermes-ubuntu2404-x64-2bd378ed1b8d-bundle-v1

      - name: Verify Hermes Agent plugin installation contract
        shell: bash
        run: |
          set -euo pipefail
          hermes plugins validate ./plugin-src --install-deps
          hermes plugins doctor ./plugin-src --ci
          echo "Hermes Agent and NaNLMind HERMES plugin admission: PASS" >> "$GITHUB_STEP_SUMMARY"

      - name: Admission checks completed without any cloud credential
        shell: bash
        run: |
          echo "Plugin admission and real Hermes Agent install: PASS" >> "$GITHUB_STEP_SUMMARY"
          echo "This job never receives the Ollama secret." >> "$GITHUB_STEP_SUMMARY"

  cloud-smoke:
    name: Gemma cloud + resumed Hermes chat (isolated runner)
    # A single authorized push with the exact commit message below runs this
    # one-time test; normal push CI and PRs NEVER read any cloud credential.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' &&
       github.event.head_commit.message == 'Verify Hermes Gemma session roundtrip')
    needs: nanrunner-hermes
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout dedicated test harness without retained Git credentials
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Python for a bounded cloud test
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Restore installed Hermes from repository Actions cache
        id: hermes-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.hermes
            ~/.local/bin/hermes
          key: hermes-ubuntu2404-x64-2bd378ed1b8d-bundle-v1

      - name: Restore repository Release runtime or pinned bootstrap
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/hermes_runtime.sh restore

      - name: Save Hermes cache before any Ollama secrets are injected
        if: steps.hermes-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.hermes
            ~/.local/bin/hermes
          key: hermes-ubuntu2404-x64-2bd378ed1b8d-bundle-v1

      - name: Verify authenticated Ollama Gemma API and resumed Hermes conversation
        shell: bash
        env:
          OLLAMA: ${{ secrets.OLLAMA }}
          OLLAMA_API_KEY: ${{ secrets.OLLAMA }}
        run: |
          set -euo pipefail
          set +x
          if [[ -z "$OLLAMA" ]]; then
            echo "ERROR: Actions repository secret OLLAMA is unavailable" >&2
            exit 2
          fi
          python scripts/ollama_gemma_smoke.py
          python scripts/hermes_gemma_session.py
          echo "Direct API and resumed Hermes/Gemma session verified." >> "$GITHUB_STEP_SUMMARY"
          echo "Model requests may consume account credits." >> "$GITHUB_STEP_SUMMARY"
